<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Двери</title>
<script>
fetch('./site.html')
  .then(r=>r.text())
  .then(html=>{
    html=html.replace('</head>','<link rel="stylesheet" href="./responsive.css?v=1"></head>');
    html=html.replace('>ЭСТ<','>Двери<');
    document.open();
    document.write(html);
    document.close();
  });
</script>
</head>
<body></body>
</html>
