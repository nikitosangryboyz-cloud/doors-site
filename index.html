<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Двери</title>
<script>
fetch('./site.html')
  .then(r=>r.text())
  .then(html=>{
    html=html.replace('</head>','<link rel="stylesheet" href="./responsive.css?v=1"><link rel="stylesheet" href="./responsive-fix.css?v=4"></head>');
    html=html.replace('>ЭСТ<','>Двери<');
    html=html.replace('</body>','<scr'+'ipt src="./responsive-interactions.js?v=3"></scr'+'ipt></body>');
    document.open();
    document.write(html);
    document.close();
  });
</script>
</head>

</html>
