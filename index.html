<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Двери</title>
<script>
fetch('./site.html')
  .then(r=>r.text())
  .then(html=>{
    html=html.replace('</head>','<link rel="stylesheet" href="./responsive.css?v=1"><link rel="stylesheet" href="./responsive-fix.css?v=2"></head>');
    html=html.replace('>ЭСТ<','>Двери<');
    html=html.replace('</body>', '<script>(function(){\n  var mq=window.matchMedia("(max-width:700px)");\n  if(!mq.matches) return;\n  var wrap=document.querySelector(".section--reviews .reviews");\n  if(!wrap) return;\n  var cards=[].slice.call(wrap.querySelectorAll(".review"));\n  if(cards.length<2) return;\n\n  var ui=document.createElement("div");\n  ui.className="reviews-ui";\n  ui.innerHTML="<span class=\"reviews-ui__hint\">Свайпайте, чтобы посмотреть отзывы</span><div class=\"reviews-ui__actions\"><button class=\"reviews-ui__button\" type=\"button\" aria-label=\"Предыдущий отзыв\">←</button><div class=\"reviews-ui__dots\"></div><button class=\"reviews-ui__button\" type=\"button\" aria-label=\"Следующий отзыв\">→</button></div>";\n  wrap.parentNode.insertBefore(ui,wrap.nextSibling);\n\n  var dotsWrap=ui.querySelector(".reviews-ui__dots");\n  var buttons=ui.querySelectorAll(".reviews-ui__button");\n  var prev=buttons[0];\n  var next=buttons[1];\n  var index=0;\n  var timer=null;\n\n  cards.forEach(function(_,i){\n    var dot=document.createElement("button");\n    dot.type="button";\n    dot.className="reviews-ui__dot"+(i===0?" is-active":"");\n    dot.setAttribute("aria-label","Отзыв "+(i+1));\n    dot.addEventListener("click",function(){go(i,true);});\n    dotsWrap.appendChild(dot);\n  });\n  var dots=[].slice.call(dotsWrap.children);\n\n  function go(i,manual){\n    index=(i+cards.length)%cards.length;\n    wrap.scrollTo({left:Math.max(0,cards[index].offsetLeft-wrap.offsetLeft-2),behavior:"smooth"});\n    dots.forEach(function(dot,n){dot.classList.toggle("is-active",n===index);});\n    if(manual) restart();\n  }\n\n  function nearest(){\n    var left=wrap.scrollLeft;\n    var best=0,dist=Infinity;\n    cards.forEach(function(card,i){\n      var d=Math.abs((card.offsetLeft-wrap.offsetLeft)-left);\n      if(d<dist){dist=d;best=i;}\n    });\n    index=best;\n    dots.forEach(function(dot,n){dot.classList.toggle("is-active",n===index);});\n  }\n\n  function start(){\n    clearInterval(timer);\n    timer=setInterval(function(){go(index+1,false);},5000);\n  }\n  function restart(){\n    clearInterval(timer);\n    setTimeout(start,6500);\n  }\n\n  prev.addEventListener("click",function(){go(index-1,true);});\n  next.addEventListener("click",function(){go(index+1,true);});\n  wrap.addEventListener("scroll",nearest,{passive:true});\n  wrap.addEventListener("touchstart",function(){clearInterval(timer);},{passive:true});\n  wrap.addEventListener("touchend",restart,{passive:true});\n  wrap.addEventListener("mouseenter",function(){clearInterval(timer);});\n  wrap.addEventListener("mouseleave",start);\n  start();\n})()</scr'+'ipt></body>');
    document.open();
    document.write(html);
    document.close();
  });
</script>
</head>
<body></body>
</html>
